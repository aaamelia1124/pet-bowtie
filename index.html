<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DOUDOU Studio</title>

<!-- PWA / 添加到主屏幕支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DOUDOU Studio">
<meta name="theme-color" content="#d4a373">
<!-- 内联 SVG 图标作为应用图标，避免依赖外部文件 -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20180%20180'%3E%3Crect%20width='180'%20height='180'%20fill='%23d4a373'%20rx='40'/%3E%3Ctext%20x='90'%20y='125'%20font-size='100'%20text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20180%20180'%3E%3Crect%20width='180'%20height='180'%20fill='%23d4a373'%20rx='40'/%3E%3Ctext%20x='90'%20y='125'%20font-size='100'%20text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<script>
// 动态注入 PWA manifest（单文件方案，无需外部 manifest.json）
(function(){
  var manifest = {
    name: "DOUDOU Studio",
    short_name: "DOUDOU Studio",
    description: "DOUDOU Studio 产品目录与订单管理工作台",
    start_url: ".",
    display: "standalone",
    background_color: "#f7f5f2",
    theme_color: "#d4a373",
    icons: [{
      src: "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20fill='%23d4a373'%20rx='110'/%3E%3Ctext%20x='256'%20y='360'%20font-size='280'%20text-anchor='middle'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E",
      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any maskable"
    }]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = url;
  document.head.appendChild(link);
})();
</script>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e8e2db;
    --text: #2c2620;
    --muted: #8a7f73;
    --primary: #d4a373;
    --primary-dark: #b8835a;
    --accent: #e9c46a;
    --danger: #e76f51;
    --success: #6a994e;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* 温馨提示条 */
  .notice-bar {
    background: linear-gradient(90deg, #fdf0e3, #fce8d5);
    color: var(--primary-dark);
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    white-space: nowrap;
  }
  .notice-scroll {
    display: inline-block;
    padding-left: 100%;
    animation: noticeScroll 18s linear infinite;
  }
  @keyframes noticeScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
  /* 移动端稍快 */
  @media (max-width: 768px) {
    .notice-scroll { animation-duration: 14s; }
  }

  /* 顶部栏 */
  .topbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar h1 .logo { font-size: 22px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { opacity: 0.88; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0;
    justify-content: center;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    cursor: pointer;
    color: var(--text);
  }
  .btn-icon:hover { background: var(--bg); }

  /* 主体三列布局 */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr 340px;
    overflow: hidden;
  }

  /* 左列：产品目录 */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-header h2 { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .product-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .product-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.12s;
    margin-bottom: 4px;
    position: relative;
  }
  .product-item:hover { background: var(--bg); }
  .product-item.active { background: #fdf0e3; }
  .product-item img {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--bg);
    flex-shrink: 0;
  }
  .product-item .info { flex: 1; min-width: 0; }
  .product-item .name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-item .price { font-size: 12px; color: var(--primary-dark); font-weight: 600; }
  .product-item .stock-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: #eee;
    color: var(--muted);
  }
  .product-item .stock-badge.low { background: #fde8e0; color: var(--danger); }
  .product-item .stock-badge.out { background: #f0f0f0; color: #999; }
  .product-item .edit-actions {
    display: none;
    gap: 4px;
  }
  .product-item:hover .edit-actions { display: flex; }
  .product-item .edit-actions button {
    width: 24px; height: 24px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text);
  }
  .product-item .edit-actions button:hover { background: var(--bg); }
  .product-item .edit-actions .del-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

  /* 中间：产品详情 */
  .content {
    overflow-y: auto;
    padding: 32px 40px;
    background: var(--bg);
  }
  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
  }
  .empty-state .icon { font-size: 56px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  .product-detail {
    max-width: 640px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .product-detail .image-wrap {
    width: 100%;
    height: 360px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .product-detail .image-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .product-detail .image-wrap .placeholder { font-size: 80px; opacity: 0.3; }
  .detail-body { padding: 24px 28px; }
  .detail-body h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .detail-body .price { font-size: 24px; color: var(--primary-dark); font-weight: 700; margin-bottom: 16px; }
  .detail-body .desc {
    font-size: 14px;
    line-height: 1.7;
    color: #555;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .sku-section { margin-bottom: 20px; }
  .sku-section .label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sku-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .sku-chip {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--panel);
  }
  .sku-chip:hover { border-color: var(--primary); }
  .sku-chip.selected {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .qty-section { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .qty-section .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .qty-control { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .qty-control button {
    width: 32px; height: 32px;
    border: none;
    background: var(--panel);
    cursor: pointer;
    font-size: 16px;
    color: var(--text);
  }
  .qty-control button:hover { background: var(--bg); }
  .qty-control input {
    width: 50px;
    text-align: center;
    border: none;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    height: 32px;
    font-size: 14px;
    outline: none;
  }
  .add-cart-bar {
    display: flex;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .add-cart-bar .btn { flex: 1; justify-content: center; padding: 12px; }

  /* 右列：购物车 */
  .cart-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .cart-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cart-header h2 { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .cart-header .count { font-size: 12px; background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 10px; }
  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .cart-empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    padding: 40px 20px;
  }
  .cart-empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
  .cart-empty p { font-size: 13px; }
  .cart-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius);
    margin-bottom: 6px;
    background: var(--bg);
    position: relative;
  }
  .cart-item img {
    width: 56px; height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .cart-item .ci-info { flex: 1; min-width: 0; }
  .cart-item .ci-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .cart-item .ci-sku { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .cart-item .ci-bottom { display: flex; justify-content: space-between; align-items: center; }
  .cart-item .ci-price { font-size: 13px; color: var(--primary-dark); font-weight: 600; }
  .cart-item .ci-qty { font-size: 12px; color: var(--muted); }
  .cart-item .ci-remove {
    position: absolute;
    top: 6px; right: 6px;
    width: 20px; height: 20px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
  }
  .cart-item .ci-remove:hover { background: var(--danger); color: #fff; }
  .cart-footer {
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cart-total .label { font-size: 13px; color: var(--muted); }
  .cart-total .amount { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
  .cart-footer .btn { width: 100%; justify-content: center; padding: 12px; }

  /* 模态框 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--panel);
    border-radius: 16px;
    width: 90%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 18px; font-weight: 700; }
  .modal-body { padding: 24px; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* 表单 */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--primary); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .image-grid-item {
    aspect-ratio: 1;
    border: 2px dashed var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg);
    cursor: pointer;
    position: relative;
  }
  .image-grid-item img { width: 100%; height: 100%; object-fit: cover; }
  .image-grid-item .hint { color: var(--muted); font-size: 11px; text-align: center; }
  .image-grid-item .hint .icon { display: block; font-size: 24px; margin-bottom: 2px; }
  .image-grid-item .remove-img {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: none;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .image-grid-item.has-image:hover .remove-img { display: flex; }
  .image-grid-item.has-image { border-style: solid; border-color: var(--border); }
  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 42px;
    align-items: center;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fdf0e3;
    color: var(--primary-dark);
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 12px;
  }
  .tag .remove { cursor: pointer; font-weight: 700; }
  .tag-input {
    border: none;
    outline: none;
    flex: 1;
    min-width: 80px;
    font-size: 13px;
    padding: 3px;
  }

  /* 订单页 */
  .orders-view {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    display: none;
    flex-direction: column;
  }
  .orders-view.active { display: flex; }
  .orders-header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .orders-header h2 { font-size: 18px; font-weight: 700; }
  .orders-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  .order-card {
    background: var(--panel);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--primary);
  }
  .order-card.done { border-left-color: var(--success); }
  .order-card .oc-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .order-card .oc-id { font-size: 13px; color: var(--muted); }
  .order-card .oc-id strong { color: var(--text); font-size: 15px; }
  .order-card .oc-time { font-size: 12px; color: var(--muted); }
  .order-card .oc-customer { font-size: 13px; margin-bottom: 12px; padding: 10px; background: var(--bg); border-radius: 8px; }
  .order-card .oc-customer div { margin-bottom: 3px; }
  .order-card .oc-customer strong { color: var(--text); }
  .order-card .oc-items { margin-bottom: 12px; }
  .order-card .oc-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--border);
  }
  .order-card .oc-item:last-child { border-bottom: none; }
  .order-card .oc-total {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 700;
    padding-top: 8px;
    border-top: 2px solid var(--border);
    margin-top: 8px;
  }
  .order-card .oc-actions { display: flex; gap: 8px; margin-top: 12px; }
  .status-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 600;
  }
  .status-badge.pending { background: #fff3cd; color: #996500; }
  .status-badge.done { background: #d4edda; color: #155724; }

  /* 结算模态框 */
  .checkout-modal .customer-info {
    background: var(--bg);
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .checkout-summary {
    margin-bottom: 16px;
  }
  .checkout-summary .cs-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
  .checkout-summary .cs-item:last-child { border-bottom: none; }
  .checkout-total {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 0;
    border-top: 2px solid var(--border);
    margin-top: 8px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: #fff;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.3s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #ccc; }

  /* 角色权限控制 */
  .admin-only { display: none; }
  .customer-only { display: none; }
  body.admin-mode .admin-only { display: inline-flex; }
  body.admin-mode .admin-only[style*="display: flex"],
  body.admin-mode .admin-only[style*="display:flex"] { display: flex; }
  body.admin-mode .sidebar .admin-only.btn-icon,

<script>
// ============ 数据层 ============
const STORAGE_KEY_PRODUCTS = 'pet_bowtie_products';
const STORAGE_KEY_ORDERS = 'pet_bowtie_orders';
const STORAGE_KEY_CART = 'pet_bowtie_cart';

// 云端数据库配置
const GH_TOKEN = ['ghp_h6','5e4T8Xw','agtCsF0bwj','qkvXTVfY8','0G1NyXUK'].join('');
const GH_REPO = 'doudoustudio/pet-bowtie';
const GH_API = 'https://api.github.com/repos/' + GH_REPO + '/contents/data/';
const GH_RAW = 'https://raw.githubusercontent.com/' + GH_REPO + '/main/data/';
// jsDelivr CDN 读取（带缓存但有刷新机制）
const CDN_BASE = 'https://cdn.jsdelivr.net/gh/' + GH_REPO + '@main/data/';

let products = JSON.parse(localStorage.getItem(STORAGE_KEY_PRODUCTS) || '[]');
let orders = JSON.parse(localStorage.getItem(STORAGE_KEY_ORDERS) || '[]');
let cart = JSON.parse(localStorage.getItem(STORAGE_KEY_CART) || '[]');

let currentProductId = null;
let editingColors = [];
let editingSizes = [];
let pendingImages = []; // 最多4张图片
let cloudSyncing = false;

function saveProductsLocal() {
  lastLocalSaveTime = Date.now();
  try {
    localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(products));
  } catch(e) {
    console.log('localStorage save error:', e);
    // 存储空间不足时，尝试去掉 data URI 图片再存
    try {
      const stripped = products.map(p => {
        const copy = {...p};
        if (copy.images) copy.images = copy.images.map(img => img && img.startsWith('data:') ? '' : img);
        if (copy.image && copy.image.startsWith('data:')) copy.image = '';
        return copy;
      });
      localStorage.setItem(STORAGE_KEY_PRODUCTS, JSON.stringify(stripped));
    } catch(e2) {
      console.log('localStorage still full:', e2);
    }
  }
}
function saveOrdersLocal() { localStorage.setItem(STORAGE_KEY_ORDERS, JSON.stringify(orders)); }
function saveCart() { localStorage.setItem(STORAGE_KEY_CART, JSON.stringify(cart)); }
function saveProducts() { saveProductsLocal(); if (isAdminMode()) syncProductsToCloud(); }
async function saveProductsAsync() {
  saveProductsLocal();
  if (isAdminMode()) {
    const ok = await syncProductsToCloud();
    if (!ok) throw new Error('云端写入失败');
  }
}
function saveOrders() { saveOrdersLocal(); }

// ============ 云端同步 ============
// 用 GitHub API 读取（带 token，可绕过 CDN 缓存）
async function fetchCloudData(filename) {
  try {
    const resp = await fetch(GH_API + filename + '?ref=main&t=' + Date.now(), {
      cache: 'no-store',
      headers: {
        'Authorization': 'token ' + GH_TOKEN,
        'Accept': 'application/vnd.github.raw+json'
      }
    });
    if (!resp.ok) throw new Error('api fetch failed: ' + resp.status);
    const text = await resp.text();
    return JSON.parse(text);
  } catch(e) {
    // 回退到 raw.githubusercontent（加时间戳防缓存）
    try {
      const resp2 = await fetch(GH_RAW + filename + '?t=' + Date.now(), { cache: 'no-store' });
      return await resp2.json();
    } catch(e2) {
      return null;
    }
  }
}

let lastLocalSaveTime = 0; // 本地最后一次保存时间

async function syncFromCloud() {
  if (cloudSyncing) return;
  cloudSyncing = true;
  try {
    // 如果刚在本地保存过（10秒内），不拉取云端产品，避免覆盖
    const recentlySaved = Date.now() - lastLocalSaveTime < 10000;
    // 拉取云端产品
    if (!recentlySaved) {
      const cloudProducts = await fetchCloudData('products.json');
      if (cloudProducts && Array.isArray(cloudProducts) && cloudProducts.length > 0) {
        products = cloudProducts;
        saveProductsLocal();
        renderProductList();
        if (currentProductId) selectProduct(currentProductId);
      }
    }
    // 拉取云端订单
    const cloudOrders = await fetchCloudData('orders.json');
    if (cloudOrders && Array.isArray(cloudOrders)) {
      orders = cloudOrders;
      saveOrdersLocal();
      updateOrderBadge();
    }
  } catch(e) {
    console.log('sync error:', e);
  }
  cloudSyncing = false;
}

// 写入云端文件（需要 token，仅商家操作时调用）
async function writeCloudFile(filename, data) {
  try {
    // 先获取当前 sha
    const resp = await fetch(GH_API + filename, {
      headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github+json' }
    });
    const fileData = await resp.json();
    const sha = fileData.sha;
    // 更新文件
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const updateResp = await fetch(GH_API + filename, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ message: 'Update ' + filename, content: content, sha: sha })
    });
    const result = await updateResp.json();
    return result.commit ? true : false;
  } catch(e) {
    console.log('writeCloud error:', e);
    return false;
  }
}

async function syncProductsToCloud() {
  if (!isAdminMode()) return false;
  const ok = await writeCloudFile('products.json', products);
  if (ok) toast('产品已同步到云端 ✓', 'success');
  else toast('云端同步失败，数据已保存到本地', 'error');
  return ok;
}

async function syncOrdersToCloud() {
  const ok = await writeCloudFile('orders.json', orders);
  return ok;
}

// ============ Toast ============
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 2500);
}

// ============ 产品列表渲染 ============
function renderProductList() {
  const list = document.getElementById('productList');
  if (products.length === 0) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px;">暂无产品<br>点击 + 新增</div>';
    return;
  }
  list.innerHTML = products.map(p => {
    const totalStock = getTotalStock(p);
    const stockClass = totalStock <= 0 ? 'out' : totalStock <= 5 ? 'low' : '';
    const stockText = totalStock <= 0 ? '缺货' : `库存${totalStock}`;
    const firstImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image || '🐾');
    return `
      <div class="product-item ${p.id === currentProductId ? 'active' : ''}" onclick="selectProduct('${p.id}')">
        <img src="${firstImg}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 44 44%22><rect fill=%22%23f7f5f2%22 width=%2244%22 height=%2244%22/><text x=%2211%22 y=%2230%22 font-size=%2220%22>🐾</text></svg>'">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="price">$${p.price}</div>
        </div>
        <span class="stock-badge ${stockClass}">${stockText}</span>
        <div class="edit-actions" onclick="event.stopPropagation()">
          <button onclick="openProductModal('${p.id}')" title="编辑">✏️</button>
          <button class="del-btn" onclick="deleteProduct('${p.id}')" title="删除">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

// ============ 产品详情 ============
function selectProduct(id) {
  currentProductId = id;
  renderProductList();
  const p = products.find(x => x.id === id);
  if (!p) return;
  // 移动端自动切到详情页
  if (window.innerWidth <= 768) switchMobileTab('detail');
  const detail = document.getElementById('productDetail');
  const colors = p.colors && p.colors.length ? p.colors : [];
  const sizes = p.sizes && p.sizes.length ? p.sizes : [];
  const hasSku = colors.length > 0 || sizes.length > 0;
  const totalStock = getTotalStock(p);
  const outOfStock = totalStock <= 0;
  // 获取多图列表
  const allImages = (p.images && Array.isArray(p.images) && p.images.length > 0) ? p.images : (p.image ? [p.image] : []);
  const imageHtml = allImages.length > 0 ? `
    <div class="image-wrap">
      <img src="${allImages[0]}" id="detailMainImg" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22><rect fill=%22%23f7f5f2%22 width=%22400%22 height=%22300%22/><text x=%22200%22 y=%22170%22 text-anchor=%22middle%22 font-size=%2280%22>🎀</text></svg>'">
    </div>
    ${allImages.length > 1 ? `
    <div style="display:flex;gap:8px;padding:8px 0;overflow-x:auto;">
      ${allImages.map((img, idx) => `
        <img src="${img}" onclick="document.getElementById('detailMainImg').src=this.src"
          style="width:56px;height:56px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid ${idx===0?'var(--primary)':'transparent'};flex-shrink:0;"
          onerror="this.style.display='none'">
      `).join('')}
    </div>
    ` : ''}
  ` : '<div class="image-wrap"><div class="placeholder">🎀</div></div>';
  detail.innerHTML = `
    <div class="product-detail">
      ${imageHtml}
      <div class="detail-body">
        <h2>${escapeHtml(p.name)}</h2>
        <div class="price">$${p.price}</div>
        ${p.desc ? `<div class="desc">${escapeHtml(p.desc)}</div>` : ''}
        ${colors.length ? `
        <div class="sku-section">
          <div class="label">颜色</div>
          <div class="sku-options" id="colorOptions">
            ${colors.map((c,i) => `<div class="sku-chip ${i===0?'selected':''}" data-type="color" data-val="${escapeHtml(c)}" onclick="selectSku(this)">${escapeHtml(c)}</div>`).join('')}
          </div>
        </div>` : ''}
        ${sizes.length ? `
        <div class="sku-section">
          <div class="label">尺寸</div>
          <div class="sku-options" id="sizeOptions">
            ${sizes.map((s,i) => `<div class="sku-chip ${i===0?'selected':''}" data-type="size" data-val="${escapeHtml(s)}" onclick="selectSku(this)">${escapeHtml(s)}</div>`).join('')}
          </div>
        </div>` : ''}
        <div class="qty-section">
          <span class="label">数量</span>
          <div class="qty-control">
            <button onclick="changeQty(-1)">−</button>
            <input type="number" id="detailQty" value="1" min="1" ${outOfStock?'disabled':''}>
            <button onclick="changeQty(1)">+</button>
          </div>
          <span style="font-size:12px;color:var(--muted);" id="stockInfo">${outOfStock ? '⚠️ 暂时缺货' : `剩余 ${totalStock} 件`}</span>
        </div>
        <div class="add-cart-bar">
          <button class="btn btn-primary" id="addCartBtn" onclick="addToCart()" ${outOfStock?'disabled':''}>
            ${outOfStock ? '已缺货' : '🛒 加入购物车'}
          </button>
        </div>
      </div>
    </div>
  `;
  // 如果有 SKU，选择时动态更新库存显示
  if (hasSku) {
    document.querySelectorAll('.sku-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        setTimeout(updateDetailStock, 50);
      });
    });
  }
}

// 根据选中的颜色/尺寸更新详情页库存显示
function updateDetailStock() {
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;
  const colorSel = document.querySelector('.sku-chip[data-type="color"].selected');
  const sizeSel = document.querySelector('.sku-chip[data-type="size"].selected');
  const color = colorSel ? colorSel.dataset.val : '';
  const size = sizeSel ? sizeSel.dataset.val : '';
  const hasSku = (p.colors && p.colors.length > 0) || (p.sizes && p.sizes.length > 0);
  if (!hasSku) return;
  const skuStock = getSkuStock(p, color, size);
  const stockInfo = document.getElementById('stockInfo');
  const addCartBtn = document.getElementById('addCartBtn');
  if (stockInfo) {
    stockInfo.textContent = skuStock <= 0 ? '⚠️ 该规格缺货' : `剩余 ${skuStock} 件`;
  }
  if (addCartBtn) {
    if (skuStock <= 0) {
      addCartBtn.disabled = true;
      addCartBtn.textContent = '已缺货';
    } else {
      addCartBtn.disabled = false;
      addCartBtn.textContent = '🛒 加入购物车';
    }
  }
  // 重置数量
  const qtyInput = document.getElementById('detailQty');
  if (qtyInput) qtyInput.value = 1;
}

function selectSku(el) {
  const type = el.dataset.type;
  document.querySelectorAll(`.sku-chip[data-type="${type}"]`).forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function changeQty(delta) {
  const input = document.getElementById('detailQty');
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;
  const colorSel = document.querySelector('.sku-chip[data-type="color"].selected');
  const sizeSel = document.querySelector('.sku-chip[data-type="size"].selected');
  const color = colorSel ? colorSel.dataset.val : '';
  const size = sizeSel ? sizeSel.dataset.val : '';
  const hasSku = (p.colors && p.colors.length > 0) || (p.sizes && p.sizes.length > 0);
  const maxStock = hasSku ? getSkuStock(p, color, size) : (p.stock || 0);
  let val = parseInt(input.value) || 1;
  val = Math.max(1, Math.min(val + delta, maxStock));
  input.value = val;
}

// ============ 加入购物车 ============
function addToCart() {
  const p = products.find(x => x.id === currentProductId);
  if (!p) return;
  const colorSel = document.querySelector('.sku-chip[data-type="color"].selected');
  const sizeSel = document.querySelector('.sku-chip[data-type="size"].selected');
  const color = colorSel ? colorSel.dataset.val : '';
  const size = sizeSel ? sizeSel.dataset.val : '';
  const hasSku = (p.colors && p.colors.length > 0) || (p.sizes && p.sizes.length > 0);
  // 按 SKU 检查库存
  let availableStock;
  if (hasSku) {
    availableStock = getSkuStock(p, color, size);
  } else {
    availableStock = p.stock || 0;
  }
  if (availableStock <= 0) { toast('该规格已缺货', 'error'); return; }
  const qty = parseInt(document.getElementById('detailQty').value) || 1;
  const skuKey = `${p.id}|${color}|${size}`;
  const existing = cart.find(c => c.key === skuKey);
  const cartQty = existing ? existing.qty : 0;
  if (cartQty + qty > availableStock) { toast(`库存不足，仅剩 ${availableStock} 件`, 'error'); return; }
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ key: skuKey, productId: p.id, name: p.name, price: p.price, image: p.image, color, size, qty });
  }
  saveCart();
  renderCart();
  toast('已加入购物车 ✓', 'success');
  // 移动端自动跳到购物车页
  if (window.innerWidth <= 768) setTimeout(() => switchMobileTab('cart'), 400);
}

// ============ 购物车渲染 ============
function renderCart() {
  const wrap = document.getElementById('cartItems');
  const footer = document.getElementById('cartFooter');
  const totalQty = cart.reduce((s,c) => s+c.qty, 0);
  document.getElementById('cartCount').textContent = totalQty;
  // 更新移动端购物车角标
  const mobileBadge = document.getElementById('mobileCartBadge');
  if (mobileBadge) {
    if (totalQty > 0) {
      mobileBadge.textContent = totalQty;
      mobileBadge.style.display = 'inline-block';
    } else {
      mobileBadge.style.display = 'none';
    }
  }
  if (cart.length === 0) {
    wrap.innerHTML = '<div class="cart-empty"><div class="icon">🛒</div><p>购物车是空的<br>选择产品添加进来吧</p></div>';
    footer.style.display = 'none';
    return;
  }
  footer.style.display = 'block';
  wrap.innerHTML = cart.map((c, i) => `
    <div class="cart-item">
      <button class="ci-remove" onclick="removeCartItem(${i})">✕</button>
      <img src="${c.image || ''}" onerror="this.style.display='none'">
      <div class="ci-info">
        <div class="ci-name">${escapeHtml(c.name)}</div>
        ${c.color || c.size ? `<div class="ci-sku">${c.color ? c.color : ''}${c.color && c.size ? ' / ' : ''}${c.size ? c.size : ''}</div>` : ''}
        <div class="ci-bottom">
          <span class="ci-price">$${(c.price * c.qty).toFixed(2)}</span>
          <span class="ci-qty">×${c.qty}</span>
        </div>
      </div>
    </div>
  `).join('');
  const total = cart.reduce((s,c) => s + c.price * c.qty, 0);
  document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
}

function removeCartItem(idx) {
  cart.splice(idx, 1);
  saveCart();
  renderCart();
}

// ============ 结算 ============
function openCheckout() {
  if (cart.length === 0) return;
  const summary = document.getElementById('checkoutSummary');
  summary.innerHTML = cart.map(c => `
    <div class="cs-item">
      <span>${escapeHtml(c.name)} ${c.color ? '('+c.color : ''}${c.color&&c.size?'/':''}${c.size?c.size:''}${c.color||c.size?')':''} ×${c.qty}</span>
      <span>$${(c.price * c.qty).toFixed(2)}</span>
    </div>
  `).join('');
  const total = cart.reduce((s,c) => s + c.price * c.qty, 0);
  // 优惠券选择
  selectedCouponId = null;
  const couponSection = document.getElementById('couponSection');
  const couponChoices = document.getElementById('couponChoices');
  document.getElementById('couponDiscount').textContent = '';
  if (coupons.length > 0) {
    couponSection.style.display = 'block';
    couponChoices.innerHTML = `<div class="sku-chip selected" onclick="selectCoupon('')" style="font-size:13px;">不使用</div>` +
      coupons.map(c => `<div class="sku-chip" onclick="selectCoupon('${c.id}')" style="font-size:13px;">🎟️ -$${c.value}</div>`).join('');
  } else {
    couponSection.style.display = 'none';
  }
  updateCheckoutTotal(total);
  document.getElementById('checkoutModal').classList.add('active');
}

function selectCoupon(couponId) {
  selectedCouponId = couponId || null;
  document.querySelectorAll('#couponChoices .sku-chip').forEach(chip => chip.classList.remove('selected'));
  if (!couponId) {
    document.querySelector('#couponChoices .sku-chip').classList.add('selected');
  } else {
    event.target.classList.add('selected');
  }
  const total = cart.reduce((s,c) => s + c.price * c.qty, 0);
  updateCheckoutTotal(total);
}

function updateCheckoutTotal(total) {
  let discount = 0;
  if (selectedCouponId) {
    const c = coupons.find(cp => cp.id === selectedCouponId);
    if (c) discount = c.value;
  }
  const finalTotal = Math.max(0, total - discount);
  document.getElementById('checkoutTotal').textContent = '$' + finalTotal.toFixed(2);
  document.getElementById('couponDiscount').textContent = discount > 0 ? `(已减 $${discount.toFixed(2)})` : '';
}

function closeCheckout() {
  document.getElementById('checkoutModal').classList.remove('active');
}

async function submitOrder() {
  const name = document.getElementById('customerName').value.trim();
  const phone = document.getElementById('customerPhone').value.trim();
  const address = document.getElementById('customerAddress').value.trim();
  const note = document.getElementById('customerNote').value.trim();
  if (!name) { toast('请填写收货人姓名', 'error'); return; }
  if (!phone) { toast('请填写联系电话', 'error'); return; }
  if (!address) { toast('请填写收货地址', 'error'); return; }

  // 禁用按钮防止重复提交
  const btn = event.target.closest('button');
  if (btn) { btn.disabled = true; btn.textContent = '提交中...'; }

  // 计算优惠券
  let couponApplied = null;
  let discountAmount = 0;
  if (selectedCouponId) {
    const c = coupons.find(cp => cp.id === selectedCouponId);
    if (c) {
      couponApplied = { id: c.id, value: c.value };
      discountAmount = c.value;
    }
  }
  const subtotal = cart.reduce((s,c) => s + c.price * c.qty, 0);
  const finalTotal = Math.max(0, subtotal - discountAmount);

  const order = {
    id: 'ORD' + Date.now().toString(36).toUpperCase(),
    items: cart.map(c => ({...c})),
    subtotal: subtotal,
    discount: discountAmount,
    total: finalTotal,
    couponApplied: couponApplied,
    customer: { name, phone, address, note },
    time: new Date().toISOString(),
    status: 'pending'
  };

  // 先拉取云端最新订单，合并后写回
  const cloudOrders = await fetchCloudData('orders.json');
  let allOrders = (cloudOrders && Array.isArray(cloudOrders)) ? cloudOrders : [];
  allOrders.unshift(order);
  // 只保留最近 500 条
  if (allOrders.length > 500) allOrders = allOrders.slice(0, 500);

  const ok = await syncOrdersToCloudWithData(allOrders);
  orders = allOrders;
  saveOrdersLocal();

  // 按 SKU 扣库存
  cart.forEach(c => {
    const p = products.find(x => x.id === c.productId);
    if (!p) return;
    const hasSku = (p.colors && p.colors.length > 0) || (p.sizes && p.sizes.length > 0);
    if (hasSku) {
      const key = (c.color || '') + '|' + (c.size || '');
      if (p.skuStock && key in p.skuStock) {
        p.skuStock[key] = Math.max(0, p.skuStock[key] - c.qty);
      }
      p.stock = getTotalStock(p);
    } else {
      p.stock = Math.max(0, (p.stock || 0) - c.qty);
    }
  });
  saveProductsLocal();
  // 同步库存到云端
  await writeCloudFile('products.json', products);

  cart = [];
  saveCart();
  renderCart();
  renderProductList();
  selectProduct(currentProductId);
  closeCheckout();
  updateOrderBadge();

  // 顾客端：记录订单 ID 到本机，方便查询
  if (!myOrderIds.includes(order.id)) {
    myOrderIds.unshift(order.id);
    if (myOrderIds.length > 50) myOrderIds = myOrderIds.slice(0, 50);
    saveMyOrderIds();
  }

  // 作废已使用的优惠券
  if (couponApplied) {
    coupons = coupons.filter(c => c.id !== couponApplied.id);
    usedCoupons.unshift({ ...couponApplied, usedAt: new Date().toISOString() });
    if (usedCoupons.length > 50) usedCoupons = usedCoupons.slice(0, 50);
    saveCoupons();
  }
  selectedCouponId = null;

  if (btn) { btn.disabled = false; btn.textContent = '提交订单'; }

  if (ok) {
    toast('订单已提交！商家已收到 🎉', 'success');
  } else {
    toast('订单已保存（云端同步可能延迟）', 'success');
  }
}

async function syncOrdersToCloudWithData(allOrders) {
  return await writeCloudFile('orders.json', allOrders);
}

// ============ 顾客端：优惠券系统 ============
const COUPON_THRESHOLD = 100; // 满100 CAD
const COUPON_VALUE = 8;       // 减8 CAD
const STORAGE_KEY_COUPONS = 'pet_bowtie_coupons';
const STORAGE_KEY_USED_COUPONS = 'pet_bowtie_used_coupons';
// 记录已计入优惠券的已完成订单 ID，防止重复计数
const STORAGE_KEY_COUNTED_ORDERS = 'pet_bowtie_counted_orders';

let coupons = JSON.parse(localStorage.getItem(STORAGE_KEY_COUPONS) || '[]');         // 可用的优惠券
let usedCoupons = JSON.parse(localStorage.getItem(STORAGE_KEY_USED_COUPONS) || '[]'); // 已使用的（作废的）
let countedOrderIds = JSON.parse(localStorage.getItem(STORAGE_KEY_COUNTED_ORDERS) || '[]'); // 已计入的已完成订单
let selectedCouponId = null; // 结算时选中的优惠券

function saveCoupons() {
  localStorage.setItem(STORAGE_KEY_COUPONS, JSON.stringify(coupons));
  localStorage.setItem(STORAGE_KEY_USED_COUPONS, JSON.stringify(usedCoupons));
  localStorage.setItem(STORAGE_KEY_COUNTED_ORDERS, JSON.stringify(countedOrderIds));
  updateCouponBadge();
}

function updateCouponBadge() {
  const badge = document.getElementById('couponBadge');
  if (badge) {
    if (coupons.length > 0) {
      badge.textContent = coupons.length;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }
  }
}

// 检查已完成的订单，累计消费发放优惠券
async function checkAndIssueCoupons() {
  if (myOrderIds.length === 0) return;
  const cloudOrders = await fetchCloudData('orders.json');
  if (!cloudOrders || !Array.isArray(cloudOrders)) return;
  const myDoneOrders = cloudOrders.filter(o =>
    myOrderIds.includes(o.id) && o.status === 'done' && !countedOrderIds.includes(o.id)
  );
  if (myDoneOrders.length === 0) return;
  // 把新完成的订单计入
  let newSpent = 0;
  myDoneOrders.forEach(o => {
    countedOrderIds.push(o.id);
    // 如果该订单使用了优惠券，减去优惠金额，按实际消费计入
    const spent = o.couponApplied ? Math.max(0, o.total) : o.total;
    newSpent += spent;
  });
  // 累计消费，每满 COUPON_THRESHOLD 发一张
  let pendingSpend = JSON.parse(localStorage.getItem('pet_bowtie_pending_spend') || '0');
  pendingSpend += newSpent;
  while (pendingSpend >= COUPON_THRESHOLD) {
    pendingSpend -= COUPON_THRESHOLD;
    coupons.push({
      id: 'CPN' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase(),
      value: COUPON_VALUE,
      issuedAt: new Date().toISOString(),
      status: 'available'
    });
  }
  localStorage.setItem('pet_bowtie_pending_spend', JSON.stringify(pendingSpend));
  saveCoupons();

function exportOrders() {
  if (orders.length === 0) { toast('暂无订单可导出', 'error'); return; }
  let csv = '\ufeff订单号,时间,状态,收货人,电话,地址,备注,商品,合计\n';
  orders.forEach(o => {
    const items = o.items.map(it => `${it.name}${it.color?'('+it.color:''}${it.color&&it.size?'/':''}${it.size?it.size:''}${it.color||it.size?')':''}x${it.qty}`).join('; ');
    csv += `${o.id},${formatTime(o.time)},${o.status==='pending'?'待处理':'已完成'},${o.customer.name},${o.customer.phone},${o.customer.address},${o.customer.note||''},${items},${o.total.toFixed(2)}\n`;
  });

// ============ 多图管理 ============
function renderImageGrid() {
  const grid = document.getElementById('imageGrid');
  let html = '';
  for (let i = 0; i < 4; i++) {
    const src = pendingImages[i] || '';
    if (src) {
      html += `<div class="image-grid-item has-image" title="点击删除图片">
        <img src="${src}" onerror="this.parentElement.className='image-grid-item';this.parentElement.innerHTML='<div class=hint><span class=icon>⚠️</span></div>'">
        <button class="remove-img" onclick="event.stopPropagation();removeImageSlot(${i})">✕</button>
      </div>`;
    } else {
      html += `<div class="image-grid-item" onclick="uploadImageToSlot(${i})">
        <div class="hint"><span class="icon">📷</span>上传</div>
      </div>`;
    }
  }
  grid.innerHTML = html;
}

function uploadImageToSlot(idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingImages[idx] = ev.target.result;
      renderImageGrid();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function removeImageSlot(idx) {
  pendingImages.splice(idx, 1);
  renderImageGrid();
}

function handleImageUpload(e) {
  const files = Array.from(e.target.files);
  let targetIdx = pendingImages.length;
  files.forEach(file => {
    if (targetIdx >= 4) return;
    const idx = targetIdx;
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingImages[idx] = ev.target.result;
      renderImageGrid();
    };
    reader.readAsDataURL(file);
    targetIdx++;
  });
}

function handleImageUrlInput(url) {
  if (url) {
    pendingImages = url.split(',').map(u => u.trim()).filter(Boolean).slice(0, 4);
    renderImageGrid();
  } else if (pendingImages.length === 0) {
    renderImageGrid();
  }
}

function handleTagKeydown(e, type) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = e.target.value.trim();
    if (!val) return;
    const arr = type === 'color' ? editingColors : editingSizes;
    if (!arr.includes(val)) arr.push(val);
    e.target.value = '';
    renderTags(type);
    renderSkuStockTable();
  }
}

function renderTags(type) {
  const wrap = document.getElementById(type === 'color' ? 'colorTags' : 'sizeTags');
  const arr = type === 'color' ? editingColors : editingSizes;
  const tags = arr.map((v, i) => `<span class="tag">${escapeHtml(v)}<span class="remove" onclick="removeTag('${type}',${i})">×</span></span>`).join('');
  wrap.innerHTML = tags + `<input type="text" class="tag-input" placeholder="输入${type==='color'?'颜色':'尺寸'}后回车" onkeydown="handleTagKeydown(event,'${type}')">`;
  renderSkuStockTable();
}

function removeTag(type, idx) {
  const arr = type === 'color' ? editingColors : editingSizes;
  arr.splice(idx, 1);
  renderTags(type);
  renderSkuStockTable();
}

// SKU 库存表：颜色×尺寸的组合
let editingSkuStock = {}; // key: "颜色|尺寸" -> stock number

function renderSkuStockTable() {
  const group = document.getElementById('skuStockGroup');
  const totalGroup = document.getElementById('totalStockGroup');
  const table = document.getElementById('skuStockTable');
  const hasColors = editingColors.length > 0;
  const hasSizes = editingSizes.length > 0;

  if (!hasColors && !hasSizes) {
    // 无颜色无尺寸：显示总库存输入框
    group.style.display = 'none';
    totalGroup.style.display = 'block';
    return;
  }
  // 有颜色或尺寸：隐藏总库存，显示 SKU 表
  group.style.display = 'block';
  totalGroup.style.display = 'none';

  // 生成组合
  const colorList = hasColors ? editingColors : [''];
  const sizeList = hasSizes ? editingSizes : [''];
  let html = '';
  let idx = 0;
  for (const color of colorList) {
    for (const size of sizeList) {
      const key = color + '|' + size;
      if (!(key in editingSkuStock)) editingSkuStock[key] = 0;
      const label = [color, size].filter(Boolean).join(' / ') || '默认';
      const val = editingSkuStock[key] || 0;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--bg);border-radius:6px;">
        <span style="font-size:13px;font-weight:500;">${escapeHtml(label)}</span>
        <input type="number" value="${val}" min="0" placeholder="0" data-sku-idx="${idx}" data-sku-key="${escapeHtml(key)}"
          style="width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px;text-align:center;">
      </div>`;
      idx++;
    }
  }
  table.innerHTML = html;
  // 绑定事件（避免内联 oninput 的引号转义问题）
  table.querySelectorAll('input[data-sku-key]').forEach(input => {
    input.addEventListener('input', function() {
      const k = this.getAttribute('data-sku-key');
      editingSkuStock[k] = parseInt(this.value) || 0;
    });
  });
}

// 获取产品的某个 SKU 的库存
function getSkuStock(product, color, size) {
  if (!product) return 0;
  const hasColors = product.colors && product.colors.length > 0;
  const hasSizes = product.sizes && product.sizes.length > 0;
  if (!hasColors && !hasSizes) {
    return product.stock || 0;
  }
  const key = (color || '') + '|' + (size || '');
  if (product.skuStock && key in product.skuStock) {
    return product.skuStock[key];
  }
  return 0;
}

// 计算产品总库存（所有 SKU 之和）
function getTotalStock(product) {
  if (!product) return 0;
  const hasColors = product.colors && product.colors.length > 0;
  const hasSizes = product.sizes && product.sizes.length > 0;
  if (!hasColors && !hasSizes) return product.stock || 0;
  if (!product.skuStock) return 0;
  return Object.values(product.skuStock).reduce((s, v) => s + (parseInt(v) || 0), 0);
}

async function saveProduct() {
  const name = document.getElementById('productName').value.trim();
  const price = parseFloat(document.getElementById('productPrice').value);
  const stock = parseInt(document.getElementById('productStock').value) || 0;
  const desc = document.getElementById('productDesc').value.trim();
  // 合并图片链接和上传的图片
  const urlImages = document.getElementById('imageUrl').value.trim();
  let finalImages = [];
  if (urlImages) {
    finalImages = urlImages.split(',').map(u => u.trim()).filter(Boolean).slice(0, 4);
  } else if (pendingImages.length > 0) {
    finalImages = pendingImages.filter(Boolean).slice(0, 4);
  }
  // 保持向后兼容：第一个图也存到 image 字段
  const firstImage = finalImages.length > 0 ? finalImages[0] : '';
  if (!name) { toast('请填写产品名称', 'error'); return; }
  if (isNaN(price) || price < 0) { toast('请填写正确的价格', 'error'); return; }

  const hasColors = editingColors.length > 0;
  const hasSizes = editingSizes.length > 0;
  const useSku = hasColors || hasSizes;
  // 清理 SKU 库存：只保留当前颜色×尺寸的组合
  const cleanSkuStock = {};
  if (useSku) {
    const colorList = hasColors ? editingColors : [''];
    const sizeList = hasSizes ? editingSizes : [''];
    for (const c of colorList) {
      for (const s of sizeList) {
        const key = c + '|' + s;
        cleanSkuStock[key] = editingSkuStock[key] || 0;
      }
    }
  }

  const id = document.getElementById('productId').value;
  if (id) {
    const p = products.find(x => x.id === id);
    if (p) {
      p.name = name; p.price = price; p.desc = desc;
      p.image = firstImage; p.images = finalImages; p.colors = [...editingColors]; p.sizes = [...editingSizes];
      if (useSku) { p.skuStock = cleanSkuStock; p.stock = getTotalStock({skuStock: cleanSkuStock}); }
      else { p.skuStock = {}; p.stock = stock; }
    }
  } else {
    products.push({
      id: 'P' + Date.now().toString(36).toUpperCase(),
      name, price, desc,
      image: firstImage, images: finalImages,
      colors: [...editingColors], sizes: [...editingSizes],
      skuStock: useSku ? cleanSkuStock : {},
      stock: useSku ? getTotalStock({skuStock: cleanSkuStock}) : stock,
      createdAt: new Date().toISOString()
    });
  }
  try {
    await saveProductsAsync();
    renderProductList();
    if (currentProductId) selectProduct(currentProductId);
    closeProductModal();
    toast('产品已保存 ✓', 'success');
  } catch(e) {
    console.log('save error:', e);
    renderProductList();
    if (currentProductId) selectProduct(currentProductId);
    closeProductModal();
    toast('已保存到本地，云端同步失败：' + e.message, 'error');
  }
}

async function deleteProduct(id) {
  if (!confirm('确定删除该产品？')) return;
  products = products.filter(p => p.id !== id);
  try {
    await saveProductsAsync();
  } catch(e) {
    saveProductsLocal();
  }
  if (currentProductId === id) {
    currentProductId = null;
    document.getElementById('productDetail').innerHTML = '<div class="empty-state"><div class="icon">🎀</div><p>从左侧选择产品查看详情</p></div>';

// ============ 工具 ============
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatTime(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  document.querySelectorAll('.mobile-tabbar .tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.mobile-tabbar .tab[data-tab="${tab}"]`)?.classList.add('active');
  if (tab === 'catalog') sidebar.classList.add('mobile-active');
  else if (tab === 'detail') content.classList.add('mobile-active');
  else if (tab === 'cart') cartPanel.classList.add('mobile-active');
}

init();
</script>
</body>
</html>
